name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '32 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  swift:
    name: Analyze (swift)
    # Fork PRs do not receive the read-only credential for the private submodule.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read the pinned shared library revision
        id: shared-core
        run: |
          revision=$(git rev-parse HEAD:Vendor/card-game-core)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: mixandmatchorg/card-game-core
          ref: ${{ steps.shared-core.outputs.revision }}
          path: Vendor/card-game-core
          token: ${{ secrets.CARD_GAME_CORE_READ_TOKEN }}
          persist-credentials: false
      - name: Resolve packages with the CodeQL toolchain
        # The release lockfiles come from Xcode 27; Swift 6.3 can resolve a different package identity.
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -resolvePackageDependencies -project Preferans.xcodeproj -scheme Preferans
          swift package resolve
      - name: Build the full iOS app
        run: |
          xcodebuild -project Preferans.xcodeproj -scheme Preferans \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Compile the iOS module for CodeQL
        # Xcode's package graph can stall under tracing; trace SwiftPM's compiler instead.
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          triple=arm64-apple-ios17.0-simulator
          swift build --target PreferansApp --triple "$triple" --sdk "$sdk" \
            -Xswiftc -target -Xswiftc "$triple" --build-system native --force-resolved-versions
      - name: Compile the Swift server for CodeQL
        run: swift build --target PreferansServer --build-system native --force-resolved-versions
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
